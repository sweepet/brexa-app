name: Compilar APK de Brexa

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Generar Keystore para Firma si no existe
        run: |
          if [ ! -f "app/brexa-release-key.jks" ]; then
            keytool -genkey -v -keystore app/brexa-release-key.jks -alias brexakey -keyalg RSA -keysize 2048 -validity 10000 -storepass brexa1234 -keypass brexa1234 -dname "CN=Brexa, OU=Finance, O=Brexa, L=Caracas, ST=Miranda, C=VE"
          fi

      - name: Compilar APK Release
        run: ./gradlew assembleRelease --stacktrace

      - name: Subir APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Brexa-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publicar en GitHub Releases (Si es Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
